/* ---------- persistence ---------- */
function lsGet(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } }
let writeQueue = Promise.resolve();
function writeDoc(name, data) {

  if (!S.store) return Promise.resolve();
  S.writing = true;
  writeQueue = writeQueue.then(() => S.store.save(name, data)).then(() => toast(t().saved)).catch(e => { console.error(e); toast((e && e.message) || 'Fehler'); }).then(() => { S.writing = false; });
  return writeQueue;
}
const DOC_NAMES = ['grades', 'edits', 'manual', 'terms', 'settings'];
/* Storage A: the Claude artifact database (when the page runs inside claude.ai). */
function claudeStore(db) {
  return {
    kind: 'claude',
    save: (name, data) => db.doc('meta/' + name).set(data),
    subscribe(onDoc, onError, onReady) {
      let pending = DOC_NAMES.length;
      for (const n of DOC_NAMES) db.doc('meta/' + n).onSnapshot(snap => {
        if (!snap.metadata.hasPendingWrites) onDoc(n, snap.exists ? snap.data() : null);
        if (!snap.metadata.fromCache && pending > 0) { pending--; if (pending === 0) onReady(); }
      }, onError);
    }
  };
}
/* Storage B: a secret GitHub gist (when the page is hosted on GitHub Pages or opened anywhere else).
   One gist named "abi-stand-data" holds one JSON file per document. The PC script writes grades.json
   into the same gist. The token is kept only in this browser. */
function gistStore(token) {
  let gistId = lsGet('abi.gistId') || null, lastUpdated = null;
  async function api(path, opts) {
    const r = await fetch('https://api.github.com' + path, Object.assign({}, opts, { headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' } }));
    if (r.status === 401) { const e = new Error('token'); e.code = 'token'; throw e; }
    if (!r.ok) throw new Error('GitHub ' + r.status);
    return r.status === 204 ? null : r.json();
  }
  async function find() {
    if (gistId) return gistId;
    const gists = await api('/gists?per_page=100');
    const g = gists.find(x => x.description === 'abi-stand-data');
    if (g) gistId = g.id;
    else { const c = await api('/gists', { method: 'POST', body: JSON.stringify({ description: 'abi-stand-data', public: false, files: { 'abi-stand.json': { content: '{"app":"abi-stand"}' } } }) }); gistId = c.id; }
    lsSet('abi.gistId', gistId); return gistId;
  }
  async function load(force) {
    const id = await find();
    const g = await api('/gists/' + id + '?t=' + Date.now());
    if (!force && lastUpdated && g.updated_at === lastUpdated) return null;
    lastUpdated = g.updated_at;
    const out = {};
    for (const n of DOC_NAMES) { const f = g.files[n + '.json']; if (!f) { out[n] = null; continue; } const txt = f.truncated ? await (await fetch(f.raw_url)).text() : f.content; try { out[n] = JSON.parse(txt); } catch (e) { out[n] = null; } }
    return out;
  }
  return {
    kind: 'gist', load,
    async save(name, data) { const id = await find(); const g = await api('/gists/' + id, { method: 'PATCH', body: JSON.stringify({ files: { [name + '.json']: { content: JSON.stringify(data) } } }) }); lastUpdated = g.updated_at; },
    subscribe(onDoc, onError, onReady) {
      let first = true;
      const poll = async (force) => {
        if (S.writing || document.querySelector('.sheet')) return;
        try { const docs = await load(force); if (docs) for (const n of DOC_NAMES) onDoc(n, docs[n]); if (first) { first = false; onReady(); } }
        catch (e) { onError(e); }

function saveSheet(form) {

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.querySelector('.sheet')) closeSheet();
  if (e.key === 'Enter' && e.target && e.target.id === 'tokeninput') { e.preventDefault(); connectGist(e.target.value); }
});
window.addEventListener('hashchange', () => { const h = location.hash.replace('#', ''); if (T.de.nav[h]) setView(h); });

function applyMode() { const root = document.documentElement; if (S.mode === 'system') root.removeAttribute('data-mode'); else root.setAttribute('data-mode', S.mode); }

/* ---------- boot ---------- */
function startStore(store) {
  S.store = store; S.status = 'loading'; render();
  const timer = setTimeout(() => { if (S.status === 'loading') { S.status = 'offline'; render(); } }, 10000);
  store.subscribe((n, data) => { S.docs[n] = data; lsSet('abi.' + n, data); if (!document.querySelector('.sheet')) render(); },
    err => { console.error(err); if (err && err.code === 'token') { S.status = 'token'; } else S.status = 'offline'; clearTimeout(timer); render(); },
    () => { clearTimeout(timer); S.status = 'ready'; render(); });
}
function connectGist(token) {
  token = String(token || '').trim();
  if (!token) return;
  lsSet('abi.token', token); lsSet('abi.gistId', null);
  startStore(gistStore(token));
}
function disconnectGist() { lsSet('abi.token', null); lsSet('abi.gistId', null); location.reload(); }
async function boot() {
  S.lang = lsGet('abi.lang') || ((navigator.language || '').startsWith('en') ? 'en' : 'de');
  S.mode = lsGet('abi.mode') || 'system'; applyMode();
  for (const n of Object.keys(S.docs)) S.docs[n] = lsGet('abi.' + n);
  const h = location.hash.replace('#', ''); if (T.de.nav[h]) S.view = h;
  render();
  if (window.claude && window.claude.use) {
    const [db, dl] = await Promise.all([window.claude.use('db'), window.claude.use('downloads')]);
    S.downloads = dl;
    if (db) { startStore(claudeStore(db)); return; }
  }
  const token = lsGet('abi.token');
  if (token) startStore(gistStore(token));
  else { S.status = 'token'; render(); }
}
boot();
})();
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
